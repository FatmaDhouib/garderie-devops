services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: garderie-backend:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
    expose:
      - "3001"
    networks:
      - garderie-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: garderie-frontend:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:3001
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    networks:
      - garderie-network
    depends_on:
      backend:
        condition: service_healthy

networks:
  garderie-network:
    driver: bridge
